---
# Overlay for the hand-run CDOGS deployment in the CHEFS namespace a12c97-prod.
#
# Layered on top of values.prod.yaml:
#   helm upgrade --install master charts/cdogs \
#     --namespace a12c97-prod \
#     --values .github/environments/values.prod.yaml \
#     --values .github/environments/values.a12c97-prod.yaml
#
# This deployment is NOT driven by the GitHub Actions pipeline, which targets
# 2250c5-dev/test/prod and consumes values.prod.yaml directly. Keep namespace
# specific settings here so the two paths cannot affect each other.

image:
  # -- Built in-namespace by bc/chefs-cdogs-build from the enterprise branch
  repository: image-registry.openshift-image-registry.svc:5000/a12c97-prod/chefs-cdogs
  # -- The BuildConfig only ever writes chefs-cdogs:latest. Because the tag floats,
  # Always is required or a rescheduled pod can silently come up on a stale cached
  # layer while its sibling runs the current build.
  tag: latest
  pullPolicy: Always

route:
  host: chefs-cdogs.apps.silver.devops.gov.bc.ca

config:
  configMap:
    # -- Carbone EE runs as a subchart in this namespace; reach it by service name
    CARBONE_URL: http://carbone-master:4000/

networkPolicy:
  # -- Replaces (does not merge with) the list in values.prod.yaml.
  # acf456-* is CHEFS 2.0, previously granted by the hand-created
  # allow-chefs2-to-cdogs policy that sat outside the Helm release.
  allowedNamespaces:
    - a12c97-dev
    - a12c97-test
    - a12c97-prod
    - acf456-dev
    - acf456-test
    - acf456-prod
