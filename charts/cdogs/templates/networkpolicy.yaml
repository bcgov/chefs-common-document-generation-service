{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-ingress-to-{{ include "cdogs.fullname" . }}-app
  labels:
    {{- include "cdogs.labels" . | nindent 4 }}
spec:
  ingress:
    {{- range .Values.networkPolicy.allowedNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: {{ default "8080" $.Values.config.configMap.SERVER_PORT | atoi }}
          protocol: TCP
    {{- end }}
  podSelector:
    matchLabels: {{- include "cdogs.selectorLabels" . | nindent 6 }}
{{- end }}
